<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TradeMind">
  <defs>
    <linearGradient id="tmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tmBg)" />
  <g stroke-linecap="round">
    <!-- 先跌：绿 -->
    <line x1="16" y1="29" x2="16" y2="51" stroke="#22c55e" stroke-width="2.5" />
    <rect x="11.5" y="34" width="9" height="12" rx="2" fill="#22c55e" />
    <!-- 后涨：红（中国市场约定：涨红跌绿） -->
    <line x1="32" y1="20" x2="32" y2="44" stroke="#ef4444" stroke-width="2.5" />
    <rect x="27.5" y="25" width="9" height="13" rx="2" fill="#ef4444" />
    <line x1="48" y1="12" x2="48" y2="36" stroke="#ef4444" stroke-width="2.5" />
    <rect x="43.5" y="17" width="9" height="13" rx="2" fill="#ef4444" />
  </g>
</svg>
